type: object
description: |
  IP and bot analysis for an event generated by the Automation Intelligence API (`/edge` endpoint). No client-side collection agent is involved, so Identification (`visitor_id`) and device-telemetry-derived Smart Signals are not available.
additionalProperties: false
allOf:
  - $ref: EventBase.yaml
  - type: object
    required:
      - source
      - ip_info
    properties:
      url:
        $ref: identification/Url.yaml
      bot_info:
        $ref: smartsignals/BotInfo.yaml
      ip_info:
        $ref: smartsignals/IPInfo.yaml
      proxy:
        $ref: smartsignals/Proxy.yaml
      proxy_confidence:
        $ref: smartsignals/ProxyConfidence.yaml
      proxy_details:
        $ref: smartsignals/ProxyDetails.yaml
      vpn:
        $ref: smartsignals/Vpn.yaml
      vpn_confidence:
        $ref: smartsignals/VpnConfidence.yaml
      vpn_methods:
        $ref: smartsignals/VpnMethods.yaml
      source:
        $ref: platform/EventSource.yaml
        const: edge
