type: object
description: An event generated by the Automation Intelligence API (`source` is `edge`), containing IP and bot analysis for a request intercepted at the edge. No client-side agent is involved, so Identification (`visitor_id`) and Smart Signals derived from device telemetry are not available. `ip_info` is always present, but is empty when no IP intelligence is available for the request.
additionalProperties: false
required:
  - event_id
  - timestamp
  - source
  - ip_info
properties:
  event_id:
    $ref: platform/EventId.yaml
  timestamp:
    $ref: platform/Timestamp.yaml
  source:
    $ref: platform/EventSource.yaml
    const: edge
  linked_id:
    $ref: platform/LinkedId.yaml
  environment_id:
    $ref: platform/EnvironmentId.yaml
  tags:
    $ref: identification/Tags.yaml
  url:
    $ref: identification/Url.yaml
  bot_info:
    $ref: smartsignals/BotInfo.yaml
  ip_info:
    $ref: smartsignals/IPInfo.yaml
  proxy:
    $ref: smartsignals/Proxy.yaml
  proxy_confidence:
    $ref: smartsignals/ProxyConfidence.yaml
  proxy_details:
    $ref: smartsignals/ProxyDetails.yaml
  vpn:
    $ref: smartsignals/Vpn.yaml
  vpn_confidence:
    $ref: smartsignals/VpnConfidence.yaml
  vpn_methods:
    $ref: smartsignals/VpnMethods.yaml
