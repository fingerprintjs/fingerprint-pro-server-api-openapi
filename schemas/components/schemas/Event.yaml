type: object
description: |
  An event, discriminated by its `source` property. Check `source` before reading other properties, because each source populates a different set of them:
  - `device` - an identification event generated by the JS agent or a mobile SDK running on an end-user device.
  - `edge` - an event generated by the Automation Intelligence API (`/edge` endpoint), analyzing a request intercepted at the edge. It contains only IP and bot analysis, and never contains Identification (`visitor_id`) or Smart Signals derived from device telemetry.
required: []
oneOf:
  - $ref: EventDevice.yaml
  - $ref: EventEdge.yaml
discriminator:
  propertyName: source
  mapping:
    device: EventDevice.yaml
    edge: EventEdge.yaml
