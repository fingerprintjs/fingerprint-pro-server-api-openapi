name: Schema diff PR comment

on:
  pull_request:

concurrency:
  group: schema-diff-pr-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  schema-diff-comment:
    name: Compare schemas and update PR comment
    if: ${{ github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build schemas
        run: pnpm build

      - name: Compute known remote schema files
        id: known-remote
        env:
          MANIFEST_URL: https://fingerprintjs.github.io/fingerprint-pro-server-api-openapi/schemas/index.json
        run: |
          KNOWN_REMOTE_FILES="$(curl -fsSL "$MANIFEST_URL" | jq -r '.files[]' | paste -sd, -)"
          echo "files=${KNOWN_REMOTE_FILES}" >> "$GITHUB_OUTPUT"

      - name: Generate schema diff report
        env:
          KNOWN_REMOTE_FILES: ${{ steps.known-remote.outputs.files }}
        run: |
          if [ -n "$KNOWN_REMOTE_FILES" ]; then
            pnpm schema:diff:published -- --json-out schema-diff-report.json --comment-out schema-diff-comment.md --known-remote-files "$KNOWN_REMOTE_FILES"
          else
            pnpm schema:diff:published -- --json-out schema-diff-report.json --comment-out schema-diff-comment.md
          fi

      - name: Upsert PR comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');

            const body = fs.readFileSync('schema-diff-comment.md', 'utf8');
            // Marker is embedded as first line of generated comment (single source of truth in renderComment.ts)
            const marker = body.split('\n')[0];
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              core.info(`Updated schema diff comment: ${existingComment.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Created schema diff comment: ${created.data.id}`);
            }
