name: Publish schema to GH pages and Readme

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/test-and-build
        with:
          testSubscriptions: '${{ secrets.TEST_SUBSCRIPTIONS }}'
      - name: Upload GitHub pages artifact 📦
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Upload built schemas for Readme 📦
        uses: actions/upload-artifact@v7
        with:
          name: schemas
          path: dist/schemas
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy to GitHub pages 🚀📘
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Docs download the published GitHub Pages YAML, so this must run after deploy-pages.
  # The docs workflows only open a PR if that file actually changed.
  trigger-docs-sync:
    name: Trigger docs OpenAPI sync
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: fingerprintjs
          repositories: docs
      - name: Trigger docs OpenAPI spec sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # contents:write is enough for repository_dispatch; the runner app
          # does not have actions:write, so workflow_dispatch would 403.
          gh api --method POST repos/fingerprintjs/docs/dispatches \
            -f event_type=openapi-schema-published

  deploy-readme:
    name: Deploy to Readme 🚀🦉
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built schemas
        uses: actions/download-artifact@v8
        with:
          name: schemas
          path: dist/schemas
      - name: Deploy to Readme APIv3 Reference 🚀🦉
        uses: readmeio/rdme@6c330ae4130595720421809c4eaa37ba95d07f87 # v10.9.5
        with:
          rdme: openapi upload dist/schemas/fingerprint-server-api-readme-explorer.yaml --key=${{ secrets.README_API_KEY }} --slug=fingerprint-pro-server-api.json
      - name: Deploy to Readme APIv4 Reference 🚀🦉
        uses: readmeio/rdme@6c330ae4130595720421809c4eaa37ba95d07f87 # v10.9.5
        with:
          rdme: openapi upload dist/schemas/fingerprint-server-api-v4-with-examples.yaml --key=${{ secrets.README_API_KEY }} --slug=fingerprint-server-api-readme-explorer.yaml
